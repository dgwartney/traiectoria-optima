site_name: Traiectoria Optima
docs_dir: docs
site_dir: site

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - src/data
            - src/models/flight
            - src/examples
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Setup: setup.md
  - Documentation Standard: documentation-standard.md
  - API Reference: reference.md
  - Makefile: makefile.md
  - Project:
      - Plan: project_plan.md
      - Data: data.md
      - Software: software.md
      - Airlines: airlines.md
      - Expected Data Format: expected_data_format.md
      - Graph Algorithms Notes: graph-algorithms-notes.md
