[project]
name = "traiectoria-optima"
version = "0.2.0"
requires-python = ">=3.12"
# The runtime contract of the `flight_planner` wheel. The package imports
# pandas and nothing else, so this stays deliberately small: everything a
# consumer needs, nothing the repository merely uses. Floors are the oldest
# versions the test suite is known to pass on, not the newest available, so
# the package installs into an existing environment (Colab, a shared cluster)
# without forcing upgrades. Everything else lives in `[dependency-groups]`,
# which is not published in the wheel metadata.
dependencies = [
    "pandas>=2.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only flight_planner is a real package; the rest of src/ is scripts, exercises
# and data-wrangling that pytest reaches through `pythonpath` below.
[tool.hatch.build.targets.wheel]
only-include = ["src/flight_planner"]
sources = ["src"]

# Not shipped in the wheel. `uv sync` installs `dev` by default; the notebook
# stack needs `uv sync --group notebooks`.
[dependency-groups]
# Running the tests, the demos, and the non-package code under src/.
dev = [
    "matplotlib>=3.8",
    # Independent oracle for the pathfinding results. Validation only -- never
    # a substitute for the algorithms, which are the deliverable. BSD-3, and
    # no required runtime dependencies of its own.
    "networkx>=3.4",
    "numpy>=1.26,<3",
    "pandas-stubs",
    "playwright>=1.48.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.3",
    "scipy>=1.11",
]
# Running the notebooks under notebooks/.
notebooks = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "ipyleaflet>=0.20.0",
    "jupyterlab>=4.6.3",
    "jupyterlab-git>=0.54.1",
    "pyproj>=3.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "src/data",
    "scripts",
    "src/models/flight",
    "src/exercises",
]

[tool.ruff]
extend-exclude = [
    "notebooks",
]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests aren't part of the documented API.
"tests/**" = ["D"]
