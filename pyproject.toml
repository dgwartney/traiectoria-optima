[project]
name = "traiectoria-optima"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "ipyleaflet>=0.20.0",
    "ipympl>=0.10.0",
    "ipython>=9.16.1",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.3",
    "jupyterlab-git>=0.54.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "ruff>=0.16.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src/data",
    "src/models/flight",
]
