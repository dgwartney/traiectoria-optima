[project]
name = "traiectoria-optima"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "ipyleaflet>=0.20.0",
    "ipympl>=0.10.0",
    "ipython>=9.16.1",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.3",
    "jupyterlab-git>=0.54.1",
    "matplotlib>=3.11.1",
    "networkx[default,extra]>=3.6.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "plotly>=6.9.0",
    "pyproj>=3.7.2",
    "ruff>=0.16.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "src/data",
    "src/models/flight",
    "src/examples",
]

[tool.ruff]
extend-exclude = [
    "notebooks",
    "src/data/data_format.py",
    "src/examples/graphs/adjacency_list.py",
]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and one-off data-wrangling scripts aren't part of the documented API.
"tests/**" = ["D"]
"src/data/fetch_airport_coords.py" = ["D"]
"src/data/fetch_missing_coords.py" = ["D"]
